<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12302c"><title>Signalpress · QR studio</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/globals.css"><link rel="stylesheet" href="/workspace.css"></head>
<body><header class="mast"><a class="brand" href="/" aria-label="Signalpress home"><img src="/logo.png" alt="">Signalpress</a><a class="install" href="/install">Get Android <span aria-hidden="true">↗</span></a></header>
<main><h1>QR print desk</h1><div class="columns"><section class="proof" aria-label="QR proof"><div class="stock"><canvas id="code" width="480" height="480" aria-label="QR code for the entered content"></canvas><div class="stockfoot"><strong>Signalpress</strong><output id="matrix"></output></div></div></section><section class="panel"><div class="seg"><button id="make" aria-pressed="true">Generate</button><button id="scan" aria-pressed="false">Read image</button></div><form id="create"><label>Text or URL<textarea id="payload" rows="4" required maxlength="900">Hello from Signalpress</textarea></label><label>Error correction<select id="level"><option value="M">Medium · 15%</option><option value="L">Low · 7%</option><option value="Q">High · 25%</option><option value="H">Highest · 30%</option></select></label><button class="action">Download PNG ↓</button></form><div id="reader" hidden><label>QR image<input id="file" type="file" accept="image/*"></label><label>Decoded content<textarea id="result" rows="4" readonly></textarea></label><p class="detail">Images are processed on this device.</p></div></section></div>
